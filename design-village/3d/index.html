<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b26">
  <title>디자인 빌리지 · 3D</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans KR", sans-serif; background: #102b26; color: #f1f3e7; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 620px); padding: clamp(24px, 6vw, 48px); border: 1px solid #38665a; border-radius: 18px; background: #173a33; box-shadow: 0 24px 70px #0005; }
    .eyebrow { color: #f2c230; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(34px, 8vw, 58px); line-height: 1.05; }
    p { color: #cfeadf; line-height: 1.7; }
    a { display: inline-block; margin-top: 12px; padding: 11px 16px; border-radius: 8px; background: #7a3aa6; color: white; text-decoration: none; font-weight: 700; }
    a:hover { background: #9254bd; }
    .board { margin: 32px auto 8px; width: 220px; height: 130px; position: relative; transform: rotateX(55deg) rotateZ(-35deg); transform-style: preserve-3d; }
    .tile { position: absolute; width: 66px; height: 58px; background: #d8c99e; clip-path: polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); box-shadow: 0 12px 0 #887954; }
    .tile:nth-child(1) { left: 76px; top: 35px; background: #e6c264; }
    .tile:nth-child(2) { left: 20px; top: 4px; }
    .tile:nth-child(3) { left: 132px; top: 4px; background: #99b38d; }
    .tile:nth-child(4) { left: 20px; top: 66px; background: #b7a2c9; }
    .tile:nth-child(5) { left: 132px; top: 66px; background: #c98e79; }
    @media (prefers-reduced-motion: no-preference) { .board { animation: float 4s ease-in-out infinite; } @keyframes float { 50% { transform: translateY(-8px) rotateX(55deg) rotateZ(-35deg); } } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Design Village · 3D</div>
    <h1>입체 마을을<br>준비하고 있어요</h1>
    <p>3D 버전 페이지를 만들었습니다. 플레이 가능한 3D 빌드가 준비되면 이 주소에 연결할 예정입니다.</p>
    <div class="board" aria-hidden="true"><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i></div>
    <a href="../">웹게임 플레이하기</a>
  </main>
</body>
</html>
